<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Fly High Volley</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: var(--bg-darker); }
    .admin-header {
      padding: 1.5rem 4rem;
      background-color: var(--bg-dark);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .stat-card i {
      font-size: 2.5rem;
      color: var(--primary);
      background: rgba(255, 87, 34, 0.1);
      padding: 1rem;
      border-radius: 50%;
    }
    .stat-info h3 { font-size: 2rem; color: var(--white); margin-bottom: 0.2rem; }
    .stat-info p { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; }
    
    .admin-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      transition: var(--transition);
      padding: 0.5rem;
    }
    .btn-icon:hover { color: var(--white); }
    .btn-view:hover { color: #3498db; }
    .btn-approve:hover { color: #2ecc71; }
    .btn-reject:hover { color: #f1c40f; }
    .btn-delete:hover { color: #e74c3c; }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-dark);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      padding: 2rem;
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      background: none; border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .close-modal:hover { color: var(--white); }
    
    .team-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .detail-group label { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; }
    .detail-group p { font-size: 1.1rem; color: var(--white); }
    .players-list-admin { grid-column: 1 / -1; }
    .players-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .player-badge {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    /* Login Overlay Styles */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-darker);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    .login-box {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      padding: 3rem 2rem;
      border-radius: 16px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .login-box h2 { font-family: var(--font-heading); color: var(--white); margin-bottom: 2rem; }
    .login-input {
      width: 100%;
      padding: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--white);
      font-size: 1.1rem;
      text-align: center;
      transition: var(--transition);
    }
    .login-input:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.8); }
    .login-btn { width: 100%; display: block; }
    .error-text { color: #e74c3c; margin-top: 1rem; display: none; font-size: 0.9rem; font-weight: 500; }

    .admin-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 1rem;
    }
    .admin-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      transition: var(--transition);
      position: relative;
    }
    .admin-tab.active {
      color: var(--primary);
    }
    .admin-tab::after {
      content: ''; position: absolute; bottom: -1rem; left: 0; width: 0; height: 3px; background: var(--primary); transition: var(--transition);
    }
    .admin-tab.active::after { width: 100%; }

    @media (max-width: 768px) {
      .admin-header { padding: 1rem 2rem; flex-direction: column; gap: 1rem; }
      .team-details-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Login Overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>Admin Login</h2>
      <input type="password" id="adminPassword" class="login-input" placeholder="Enter Password">
      <button class="btn btn-primary login-btn" id="loginBtn">Access Dashboard</button>
      <div class="error-text" id="loginError">Incorrect password. Try again.</div>
      <a href="index.html" style="display:block; margin-top:1.5rem; color:var(--text-muted); text-decoration:none; font-size: 0.9rem;">&larr; Back to Main Site</a>
    </div>
  </div>

  <header class="admin-header">
    <div class="logo">Fly High Volley <span style="color:var(--primary); font-size: 1rem; vertical-align: middle; margin-left: 0.5rem; padding: 0.2rem 0.5rem; border: 1px solid var(--primary); border-radius: 4px;">ADMIN</span></div>
    <div>
      <button class="btn btn-outline btn-small" id="logoutBtn" style="margin-right: 0.5rem;"><i class="fas fa-sign-out-alt"></i> Logout</button>
      <a href="index.html" class="btn btn-primary btn-small"><i class="fas fa-home"></i> Site</a>
    </div>
  </header>

  <div class="admin-container">
    <div class="dashboard-stats">
      <div class="stat-card">
        <i class="fas fa-users"></i>
        <div class="stat-info">
          <h3 id="totalTeams">0</h3>
          <p>Total Teams</p>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-check-circle"></i>
        <div class="stat-info">
          <h3 id="approvedTeams">0</h3>
          <p>Approved</p>
        </div>
      </div>
      <div class="stat-card">
        <i class="fas fa-clock"></i>
        <div class="stat-info">
          <h3 id="pendingTeams">0</h3>
          <p>Pending</p>
        </div>
      </div>
    </div>

    <div class="glass-panel" style="padding: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
        <h2 style="font-family: var(--font-heading); margin: 0;">Manage Teams</h2>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="adminSearch" placeholder="Search teams or captains...">
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" id="adminTabBoys">Boys Teams</button>
        <button class="admin-tab" id="adminTabGirls">Girls Teams</button>
      </div>
      
      <div class="table-responsive">
        <table class="teams-table" id="adminTable">
          <thead>
            <tr>
              <th>ID / Date</th>
              <th>Team Name</th>
              <th>Captain</th>
              <th>Contact</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Team Details Modal -->
  <div class="modal" id="teamModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
      <h2 style="font-family: var(--font-heading); border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; margin-bottom: 1rem;" id="modalTeamName">Team Name</h2>
      
      <div class="team-details-grid">
        <div class="detail-group">
          <label>Captain</label>
          <p id="modalCaptain"></p>
        </div>
        <div class="detail-group">
          <label>Registration Date</label>
          <p id="modalDate"></p>
        </div>
        <div class="detail-group">
          <label>Phone Number</label>
          <p id="modalPhone"></p>
        </div>
        <div class="detail-group">
          <label>Email Address</label>
          <p id="modalEmail"></p>
        </div>
        <div class="detail-group">
          <label>Category</label>
          <p id="modalCategory"></p>
        </div>
        <div class="detail-group players-list-admin">
          <label>Roster (<span id="modalPlayerCount">0</span> Players)</label>
          <div class="players-badges" id="modalPlayers">
            <!-- Badges go here -->
          </div>
        </div>
      </div>
      
      <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;" id="modalActions">
        <!-- Actions populated dynamically based on status -->
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
